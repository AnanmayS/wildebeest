# Load balancer in front of the coordinator replicas (docs/decisions/h-ha.md).
#
# Workers (COORDINATOR_URL) and the dashboard's nginx talk to coordinator-lb:3000, never to a
# replica. Any replica can serve any request; leadership is invisible from here.
#
# Health: GET /healthz every second; two failures (a dead or frozen replica) take a replica out,
# and its open connections are cut (on-marked-down shutdown-sessions), so a worker stuck on a
# `docker pause`d replica gets an error it retries instead of waiting out its 10 s timeout.
# Retries: only when the connection to a replica fails (the request never reached it). A request
# that did reach a replica that then died is answered 502/504 and the worker retries it itself
# (complete/fail/release for up to one lease; the lease epoch fences any duplicate).

global
  log stdout format raw local0 notice
  maxconn 4096

defaults
  mode http
  log global
  option dontlognull
  option redispatch
  retries 3
  timeout connect 1s
  timeout check 1s
  timeout client 120s
  # Long enough for job creation (uploads, 1M-task synthetic jobs); workers' own calls take ms,
  # their long-poll claims at most CLAIM_WAIT_MAX_MS (5 s).
  timeout server 120s
  timeout http-keep-alive 10s
  # Dashboard WebSockets (/events) once upgraded.
  timeout tunnel 1h

# Docker's embedded DNS: replicas are found by service name, and a replica recreated with a new
# IP is picked up without restarting the balancer.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold other 2s
  hold nx 2s
  hold timeout 2s
  hold refused 2s
  hold obsolete 5s

frontend api
  bind :3000
  option forwardfor
  default_backend coordinators

backend coordinators
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  default-server check inter 1s fastinter 500ms downinter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions
  server coordinator coordinator:3000
  server coordinator-2 coordinator-2:3000
