x-model-env: &model-env
  # speciesnet 5.0.5, model kaggle:google/speciesnet/pyTorch/v4.0.3a/1 (detector: MegaDetector md_v5a.0.1)
  DETECTOR_MODEL_VERSION: ${DETECTOR_MODEL_VERSION:-speciesnet-md_v5a.0.1-640}
  CLASSIFIER_MODEL_VERSION: ${CLASSIFIER_MODEL_VERSION:-speciesnet-v4.0.3a}
  MODEL_BACKEND: ${MODEL_BACKEND:-speciesnet}
  TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-2}
  # 640 is ~2.5x faster on CPU than 1280 at the same accuracy on this data (see DECISIONS).
  # If you change it, change DETECTOR_MODEL_VERSION too so cached results aren't reused.
  DETECTOR_IMG_SIZE: ${DETECTOR_IMG_SIZE:-640}

# Tracing (docs/decisions/o-observability.md). Empty endpoint = off: no SDK is loaded at all.
# With the observability profile, point it at the bundled collector:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 docker compose --profile observability up -d
# OTEL_TRACES_SAMPLER=parentbased_traceidratio + OTEL_TRACES_SAMPLER_ARG=0.1 keeps 10% of images
# (the coordinator decides per image; workers follow the traceparent flags).
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-1000}
  OTEL_BSP_MAX_QUEUE_SIZE: ${OTEL_BSP_MAX_QUEUE_SIZE:-32768}
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: ${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:-2048}

x-worker: &worker
  build: ./worker
  image: wildebeest-worker:${WORKER_TAG:-latest}
  restart: "no"
  depends_on:
    coordinator-lb:
      condition: service_healthy
  volumes:
    - model-cache:/models
  stop_grace_period: 12s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wildebeest
      POSTGRES_USER: wildebeest
      POSTGRES_PASSWORD: wildebeest
    ports: ["${POSTGRES_HOST_PORT:-15432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildebeest"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports: ["${REDIS_HOST_PORT:-16379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  minio:
    image: pgsty/minio  # maintained MinIO fork; the official minio/minio image is no longer pullable
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  # Two coordinator replicas behind coordinator-lb (docs/decisions/h-ha.md). Both serve the whole
  # API; the one holding the Postgres leader lease also runs the singleton loops. coordinator-2
  # extends this service, so settings added here apply to both.
  coordinator:
    build: ./coordinator
    image: wildebeest-coordinator:${WORKER_TAG:-latest}
    environment:
      <<: [*model-env, *otel-env]
      OTEL_SERVICE_NAME: wildebeest-coordinator
      COORDINATOR_ID: ${COORDINATOR_ID:-coord-1}
      # Leader lease (River-style): renewed every LEADER_RENEW_MS, taken over LEADER_TTL_MS after the
      # leader's last renewal.
      LEADER_TTL_MS: ${LEADER_TTL_MS:-5000}
      LEADER_RENEW_MS: ${LEADER_RENEW_MS:-1000}
      PORT: 3000
      DATABASE_URL: postgres://wildebeest:wildebeest@postgres:5432/wildebeest
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: wildebeest
      SAMPLE_DIR: /data/sample
      LEASE_MS: ${LEASE_MS:-15000}
      HEARTBEAT_MS: ${HEARTBEAT_MS:-2000}
      WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-6000}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      # Workers size their claim batch online (≈ round trip ÷ service time) between these two.
      CLAIM_BATCH_SIZE: ${CLAIM_BATCH_SIZE:-1}
      MAX_CLAIM_BATCH: ${MAX_CLAIM_BATCH:-16}
      # hybrid (Redis ready queues) | postgres (workers long-poll POST /tasks/claim, SKIP LOCKED).
      CLAIM_MODE: ${CLAIM_MODE:-hybrid}
      # push (push after commit, 200 ms repair sweep) | tick (the P1 dispatcher, for A/B runs).
      DISPATCH_MODE: ${DISPATCH_MODE:-push}
      ANIMAL_CONF_THRESHOLD: ${ANIMAL_CONF_THRESHOLD:-0.2}
      CLASSIFY_QUEUE_HIGH_WATER: ${CLASSIFY_QUEUE_HIGH_WATER:-500}
      CLASSIFY_QUEUE_LOW_WATER: ${CLASSIFY_QUEUE_LOW_WATER:-200}
      # Empty = scale queue:detect with live detect workers × claim batch (floor DETECT_QUEUE_MIN).
      DETECT_QUEUE_TARGET: ${DETECT_QUEUE_TARGET:-}
      DETECT_QUEUE_MIN: ${DETECT_QUEUE_MIN:-8}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-TZA}
      HUMAN_REVIEW_SECONDS_PER_IMAGE: ${HUMAN_REVIEW_SECONDS_PER_IMAGE:-3}
      # Docker die/oom events as the fast failure detector (auto | off); heartbeats stay the backstop.
      DOCKER_EVENTS: ${DOCKER_EVENTS:-auto}
      # Full-jitter backoff before a failed task is retried: random(0, min(max, base * 2^errors)).
      RETRY_BASE_MS: ${RETRY_BASE_MS:-500}
      RETRY_MAX_MS: ${RETRY_MAX_MS:-30000}
      # Straggler speculation (on | off): when a stage's queue is empty and a worker is idle, a task
      # running > max(SPECULATE_MIN_MS, SPECULATE_MULTIPLIER × stage p50) gets one copy on the fastest
      # idle worker; the first result wins. Workers slower than PROBATION × stage p50 get no copies.
      SPECULATION: ${SPECULATION:-on}
      SPECULATE_MULTIPLIER: ${SPECULATE_MULTIPLIER:-3}
      SPECULATE_MIN_MS: ${SPECULATE_MIN_MS:-1000}
      SPECULATE_PROBATION_MULTIPLIER: ${SPECULATE_PROBATION_MULTIPLIER:-3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/sample:/data/sample:ro
      - ./benchmarks:/benchmarks:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      retries: 60

  coordinator-2:
    extends: { service: coordinator }
    environment:
      COORDINATOR_ID: ${COORDINATOR_2_ID:-coord-2}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # The stable address workers and the dashboard use. Health-checks both replicas and routes around
  # a dead or frozen one; the host port that used to be the coordinator's is now this one.
  coordinator-lb:
    image: haproxy:3.2-alpine
    volumes:
      - ./lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports: ["${COORDINATOR_PORT:-3000}:3000"]
    depends_on:
      coordinator: { condition: service_started }
      coordinator-2: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      retries: 60

  detector:
    <<: *worker
    environment:
      <<: [*model-env, *otel-env]
      OTEL_SERVICE_NAME: wildebeest-detector
      WORKER_STAGE: detect
      COORDINATOR_URL: http://coordinator-lb:3000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: wildebeest
      FAKE_MODEL_DELAY_MS: ${FAKE_MODEL_DELAY_MS:-300}
      # Report buffering: 0 = auto (flush every claim batch), 1 = one complete per task.
      COMPLETE_BATCH: ${COMPLETE_BATCH:-0}
      COMPLETE_FLUSH_MS: ${COMPLETE_FLUSH_MS:-50}
      # Download the next leased image while the current one runs (0 = off).
      PREFETCH: ${PREFETCH:-1}
    deploy:
      resources:
        limits:
          memory: ${DETECTOR_MEM_LIMIT:-2000m}

  classifier:
    <<: *worker
    environment:
      <<: [*model-env, *otel-env]
      OTEL_SERVICE_NAME: wildebeest-classifier
      WORKER_STAGE: classify
      COORDINATOR_URL: http://coordinator-lb:3000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: wildebeest
      FAKE_MODEL_DELAY_MS: ${FAKE_MODEL_DELAY_MS:-300}
      COMPLETE_BATCH: ${COMPLETE_BATCH:-0}
      COMPLETE_FLUSH_MS: ${COMPLETE_FLUSH_MS:-50}
      PREFETCH: ${PREFETCH:-1}
    deploy:
      resources:
        limits:
          memory: ${CLASSIFIER_MEM_LIMIT:-1300m}

  # Observability (--profile observability): OTel collector, Tempo, Prometheus, Loki and Grafana in
  # one dev container, with the Wildebeest dashboard provisioned and the coordinator's
  # /metrics/prom scraped every 2 s. Grafana: http://localhost:${GRAFANA_PORT:-3300} (anonymous admin).
  lgtm:
    image: grafana/otel-lgtm:${LGTM_TAG:-latest}
    profiles: [observability]
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_PORT:-3200}:3200"
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana/wildebeest-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/wildebeest.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/wildebeest-dashboards:ro
    deploy:
      resources:
        limits:
          memory: ${LGTM_MEM_LIMIT:-1800m}

  dashboard:
    build: ./dashboard
    ports: ["${DASHBOARD_PORT:-8080}:80"]
    depends_on:
      coordinator-lb: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  model-cache:
