# Wildebeest dashboard: serve the Vite build and proxy /api to the coordinator.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 500m;   # multipart photo uploads

  # Resolve "coordinator" through Docker's DNS at request time, so nginx keeps
  # working if the coordinator container is recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $coordinator http://coordinator:3000;

  # WebSocket: /api/events -> coordinator:3000/events
  location = /api/events {
    rewrite ^ /events break;
    proxy_pass $coordinator;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # REST: /api/foo -> coordinator:3000/foo (prefix stripped, query string kept)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $coordinator;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
